<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가족은 어떤 가족일까 — 입양의날</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #F8F3EB;
  --bg-card:      #FEFCF8;
  --text:         #1E1610;
  --text-mid:     #6B5B4A;
  --text-light:   #A8927E;
  --accent:       #B85C38;
  --accent-bg:    #F5E8DF;
  --accent-text:  #8A3D21;
  --border:       #E2D8CE;
  --border-hover: #C4B5A5;
  --progress:     #8C9E8A;
  --serif: 'Noto Serif KR', Georgia, serif;
  --sans:  'Noto Sans KR', system-ui, sans-serif;
}

html { background: var(--bg); }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Progress ── */
.progress-track {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--border);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: var(--progress);
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
}

/* ── Screens ── */
.screen {
  width: 100%;
  max-width: 540px;
  padding: clamp(60px, 10vh, 100px) 28px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.screen.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.screen.hidden { display: none; }

/* ── Intro ── */
.eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: 2.5rem;
}

.intro-title {
  font-family: var(--serif);
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 600;
  line-height: 1.25;
  color: var(--text);
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.intro-desc {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.9;
  margin-bottom: 2rem;
  word-break: keep-all;
  max-width: 400px;
  font-weight: 300;
}

.intro-meta {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 3rem;
  letter-spacing: .04em;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 15px 32px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .2s, transform .15s;
  border-radius: 2px;
}
.btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

/* ── Question ── */
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3.5rem;
}

.q-num {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: .06em;
}

.q-axis {
  font-size: 11px;
  color: var(--text-light);
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
}

.q-text {
  font-family: var(--serif);
  font-size: clamp(17px, 3.5vw, 22px);
  font-weight: 400;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  word-break: keep-all;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.choice-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .1s;
  word-break: keep-all;
}
.choice-card:hover {
  border-color: var(--border-hover);
  background: #FEFAF5;
  transform: translateX(3px);
}
.choice-card.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  transform: translateX(0);
}
.choice-glyph {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-light);
  letter-spacing: .08em;
  margin-bottom: 7px;
}
.choice-card.selected .choice-glyph { color: var(--accent); }
.choice-body {
  font-size: 14px;
  color: var(--text-mid);
  line-height: 1.75;
}
.choice-card.selected .choice-body { color: var(--accent-text); }

/* ── Result ── */
.result-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: .75rem;
  text-transform: uppercase;
}

.result-name {
  font-family: var(--serif);
  font-size: clamp(24px, 5.5vw, 36px);
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.result-tagline {
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: .02em;
  margin-bottom: 1.5rem;
  word-break: keep-all;
}

.result-traits {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 2.5rem;
}

.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: .75rem;
}

.signature-box {
  background: var(--bg-card);
  border-left: 2px solid var(--border-hover);
  padding: 18px 22px;
  font-size: 14px;
  line-height: 1.85;
  color: var(--text-mid);
  word-break: keep-all;
  font-weight: 300;
}

.power-box {
  background: var(--accent-bg);
  border-radius: 4px;
  padding: 18px 22px;
  font-size: 14px;
  line-height: 1.85;
  color: var(--accent-text);
  word-break: keep-all;
}

.reveal {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .55s ease, transform .55s ease;
  margin-bottom: 2rem;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.bridge-wrap {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .65s ease .7s, transform .65s ease .7s;
}
.bridge-wrap.visible { opacity: 1; transform: translateY(0); }

.bridge-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1.75rem;
}
.bridge-line { flex: 1; height: 1px; background: var(--border); }
.bridge-label {
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: .1em;
  white-space: nowrap;
}

.result-bridge {
  font-size: 15px;
  color: var(--text);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 1rem;
}

.slogan-line {
  font-family: var(--serif);
  font-size: clamp(15px, 2.6vw, 17px);
  font-weight: 600;
  color: var(--accent-text);
  line-height: 1.6;
  margin-top: 1.25rem;
  letter-spacing: .01em;
  word-break: keep-all;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 2.5rem;
  flex-wrap: wrap;
  opacity: 0;
  transition: opacity .5s ease 1.5s;
}
.result-actions.visible { opacity: 1; }

.btn-ghost {
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border);
  padding: 12px 22px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
  transition: border-color .2s, color .2s;
}
.btn-ghost:hover { border-color: var(--text-mid); color: var(--text); }

.btn-accent {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 12px 22px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
  transition: background .2s;
}
.btn-accent:hover { background: var(--accent-bg); }

.campaign-footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.8;
  opacity: 0;
  transition: opacity .5s ease 2s;
  word-break: keep-all;
}
.campaign-footer.visible { opacity: 1; }
.footer-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-mid);
  margin-bottom: 6px;
}

/* ── Desktop: side-by-side choices ── */
@media (min-width: 580px) {
  .choices { flex-direction: row; }
  .choice-card { flex: 1; }
  .choice-card:hover { transform: translateY(-2px); }
}

@media (max-width: 480px) {
  .screen { padding: 56px 20px 40px; }
  .q-header { margin-bottom: 2.5rem; }
}
</style>
</head>
<body>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Intro -->
<div class="screen" id="screenIntro">
  <p class="eyebrow">입양의날 캠페인 &nbsp;·&nbsp; 5월 11일</p>
  <h1 class="intro-title">우리 가족은<br>어떤 가족일까요?</h1>
  <p class="intro-desc">
    8가지 질문에 솔직하게 답해주세요.<br>
    우리 가족만의 이야기를 들려드릴게요.<br>
    그리고, 한 가지를 더 알려드립니다.
  </p>
  <p class="intro-meta">약 2분 소요 &nbsp;·&nbsp; 정답 없음</p>
  <button class="btn-primary" onclick="startTest()">시작하기 &nbsp;→</button>
</div>

<!-- Question -->
<div class="screen hidden" id="screenQuestion">
  <div class="q-header">
    <span class="q-num" id="qNum">Q.1 / 6</span>
    <span class="q-axis" id="qAxis"></span>
  </div>
  <p class="q-text" id="qText"></p>
  <div class="choices" id="choices"></div>
</div>

<!-- Result -->
<div class="screen hidden" id="screenResult">
  <p class="eyebrow">나의 가족 유형</p>
  <p class="result-tag" id="rTag"></p>
  <h2 class="result-name" id="rName"></h2>
  <p class="result-tagline" id="rTagline"></p>
  <p class="result-traits" id="rTraits"></p>

  <div class="reveal" id="signatureWrap">
    <p class="section-label">이게 바로 찐모습</p>
    <div class="signature-box" id="rSignature"></div>
  </div>

  <div class="reveal" id="powerWrap">
    <p class="section-label">함께여서 POWER UP</p>
    <div class="power-box" id="rPower"></div>
  </div>

  <div class="bridge-wrap" id="bridgeWrap">
    <div class="bridge-divider">
      <div class="bridge-line"></div>
      <span class="bridge-label">사실은</span>
      <div class="bridge-line"></div>
    </div>
    <p class="result-bridge" id="rBridge"></p>
    <p class="slogan-line">입양, 한 아이의 온 세상을 만듭니다</p>
  </div>

  <div class="result-actions" id="rActions">
    <button class="btn-primary" onclick="shareResult()">결과 저장하기</button>
    <button class="btn-ghost" onclick="retryTest()">다시 하기</button>
    <button class="btn-accent" onclick="shareSNS()">SNS 공유하기</button>
    <button class="btn-accent" onclick="learnMore()">자세한 내용 확인하기 →</button>
  </div>

  <div class="campaign-footer" id="rFooter">
    <p class="footer-title">입양의날 인식개선 캠페인</p>
    지금 이 순간에도 가족을 기다리는 아이들이 있습니다.<br>
    한 아이의 온 세상이 되어줄 수 있는 가족을 기다리고 있어요.
  </div>
</div>

<script>
const Qs = [
  { text: "우리 가족은 주말이 되면?", a: "집에서 각자 혹은 같이 푹 쉬는 게 최고!", b: "무조건 밖으로! 새로운 곳을 찾아 떠나야지!", axis: "주말" },
  { text: "우리 가족이 대화할 때는 보통?", a: "조용조용하고 차분하게 필요한 이야기를 나눠요.", b: "하하호호 웃음소리가 끊이지 않고 시끌벅적해요!", axis: "대화" },

  { text: "가족 여행 계획을 세울 때 우리 가족은?", a: "시간 단위로 꼼꼼하게 일정을 짜는 계획파", b: "발길 닿는 대로 그날 기분에 따라 움직이는 자유파", axis: "여행" },
  { text: "우리 가족의 애정 표현 방식은?", a: "말하지 않아도 느껴지는 묵묵한 배려와 챙겨주기", b: "'사랑해', '고마워' 표현도 듬뿍 적극적인 표현!", axis: "애정" },
  { text: "기쁜 일이 생겼을 때 우리 가족은?", a: "오붓하게 모여 맛있는 음식을 먹으며 축하해요.", b: "주변 사람들에게도 알리고 크게 잔치를 벌여요!", axis: "기쁨" },
  { text: "우리 가족을 한 단어로 정의한다면?", a: "언제든 돌아와 쉴 수 있는 '포근한 보금자리'", b: "함께라면 무엇이든 즐거운 '최고의 팀'", axis: "정의" }
];

const Weights = [
  { A: [1,5,7,9],  B: [2,3,6,8] },
  { A: [1,4,7,10], B: [2,3,6,8] },
  { A: [1,3,7,10], B: [2,4,5,8] },
  { A: [1,4,5,8],  B: [2,3,6,9] },
  { A: [4,7,8,10], B: [2,5,6,9] },
  { A: [1,7,9,10], B: [2,3,5,6] },
  { A: [1,5,7,10], B: [3,4,6,8] },
  { A: [1,7,9,10], B: [2,3,4,8] }

const Results = [
  {

let curQ = 0, answers = [];

function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
    s.classList.remove('visible');
  });
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function startTest() {
  curQ = 0; answers = [];
  setProgress(0);
  renderQuestion();
  show('screenQuestion');
}

function renderQuestion() {
  const q = Qs[curQ];
  document.getElementById('qNum').textContent = `Q.${curQ + 1} / ${Qs.length}`;
  document.getElementById('qAxis').textContent = q.axis;
  document.getElementById('qText').textContent = q.text;
  setProgress((curQ / Qs.length) * 100);

  const container = document.getElementById('choices');
  container.innerHTML = '';
  [{ g: 'ㄱ', t: q.a, v: 'A' }, { g: 'ㄴ', t: q.b, v: 'B' }].forEach(opt => {
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.innerHTML = `<div class="choice-glyph">${opt.g}</div><div class="choice-body">${opt.t}</div>`;
    card.addEventListener('click', () => pick(opt.v, card));
    container.appendChild(card);
  });
}

function pick(val, el) {
  document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  answers.push(val);

  setTimeout(() => {
    curQ++;
    if (curQ < Qs.length) {
      const scr = document.getElementById('screenQuestion');
      scr.style.opacity = '0';
      scr.style.transform = 'translateY(-14px)';
      setTimeout(() => {
        renderQuestion();
        scr.style.transition = 'none';
        scr.style.opacity = '0';
        scr.style.transform = 'translateY(20px)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          scr.style.transition = '';
          scr.style.opacity = '1';
          scr.style.transform = 'translateY(0)';
        }));
      }, 300);
    } else {
      showResult();
    }
  }, 380);
}

function showResult() {
  setProgress(100);
  const score = answers.filter(a => a === 'A').length;
  const r = score <= 1 ? Results[0] : score <= 3 ? Results[1] : score <= 4 ? Results[2] : Results[3];

  document.getElementById('rLabel').textContent = r.label;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rMe').textContent = r.me;
  document.getElementById('rBridge').textContent = r.bridge;
  document.getElementById('rChildTag').textContent = r.childTag;

  ['bridgeWrap', 'rActions', 'rFooter'].forEach(id => document.getElementById(id).classList.remove('visible'));
  show('screenResult');

  setTimeout(() => document.getElementById('bridgeWrap').classList.add('visible'), 500);
  setTimeout(() => {
    document.getElementById('rActions').classList.add('visible');
    document.getElementById('rFooter').classList.add('visible');
  }, 1300);
}

function retryTest() {
  const scr = document.getElementById('screenResult');
  scr.style.opacity = '0'; scr.style.transform = 'translateY(-14px)';
  setTimeout(startTest, 300);
}

function shareResult() {
  const name = document.getElementById('rName').textContent;
  const label = document.getElementById('rLabel').textContent;
  const text = `${label} "${name}"\n입양의날 캠페인에서 나에 대해 알게 됐어요.`;
  if (navigator.share) {
    navigator.share({ title: '나는 어떤 사람일까', text, url: location.href });
  } else {
    navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다.'));
  }
}

function learnMore() {
  alert('캠페인 공식 페이지로 이동합니다.\n(랜딩페이지 URL 연결 예정)');
}
