<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가족은 어떤 가족일까 — 입양의날</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

::selection { background: var(--accent-bg); color: var(--accent-text); }

@keyframes sticker-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

@media (prefers-reduced-motion: no-preference) {
  .intro-mark { animation: sticker-float 3.6s ease-in-out infinite; }
}

:root {
  --bg:           #FAF0DC;
  --bg-card:      #FFFCF5;
  --text:         #3A2814;
  --text-mid:     #7A6953;
  --text-light:   #B5A28D;
  --accent:       #C26B45;
  --accent-bg:    #F8E5D7;
  --accent-text:  #8A3D21;
  --border:       #EAD9C8;
  --border-hover: #C4B5A5;
  --progress:     #9BB29A;

  --sky:          #C7DEED;
  --butter:       #F8E198;
  --rose:         #F2A5B6;
  --leaf:         #9BB29A;

  --display: 'Gowun Batang', Georgia, serif;
  --body:    'Gowun Dodum', system-ui, sans-serif;
  --ui:      'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
  --serif:   var(--display);
  --sans:    var(--ui);
}

html { background: var(--bg); }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

/* ── Progress ── */
.progress-track {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: var(--progress);
  border-radius: 0 999px 999px 0;
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
}

/* ── Screens ── */
.screen {
  width: 100%;
  max-width: 540px;
  padding: clamp(60px, 10vh, 100px) 28px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.screen.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.screen.hidden { display: none; }

/* ── Intro ── */
.eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: 2.5rem;
}

.intro-title {
  font-family: var(--serif);
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 600;
  line-height: 1.25;
  color: var(--text);
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.intro-desc {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.9;
  margin-bottom: 2rem;
  word-break: keep-all;
  max-width: 400px;
  font-weight: 300;
}

.intro-meta {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 3rem;
  letter-spacing: .04em;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 14px 30px;
  font-family: var(--ui);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: .02em;
  transition: background .2s, transform .15s, box-shadow .2s;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(58, 40, 20, 0.12);
}
.btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

/* ── Question ── */
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3.5rem;
}

.q-num {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: .06em;
}

.q-axis {
  font-family: var(--ui);
  font-size: 11px;
  color: var(--text-mid);
  padding: 4px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  letter-spacing: .02em;
}

.q-text {
  font-family: var(--serif);
  font-size: clamp(17px, 3.5vw, 22px);
  font-weight: 400;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  word-break: keep-all;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.choice-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .15s, box-shadow .2s;
  word-break: keep-all;
  box-shadow: 0 2px 8px rgba(58, 40, 20, 0.04);
}
.choice-card:hover {
  border-color: var(--border-hover);
  background: #FEFAF5;
  transform: translateX(3px);
  box-shadow: 0 6px 18px rgba(58, 40, 20, 0.08);
}
.choice-card.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  transform: translateX(0);
  box-shadow: 0 4px 14px rgba(194, 107, 69, 0.18);
}
.choice-body {
  font-size: 14px;
  color: var(--text-mid);
  line-height: 1.75;
}
.choice-card.selected .choice-body { color: var(--accent-text); }

/* ── Result ── */
.result-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: .75rem;
  text-transform: uppercase;
}

.result-name {
  font-family: var(--serif);
  font-size: clamp(24px, 5.5vw, 36px);
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.result-tagline {
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: .02em;
  margin-bottom: 1.5rem;
  word-break: keep-all;
}

.result-traits {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 2.5rem;
}

.section-label {
  font-family: var(--ui);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: .75rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.type-img {
  display: block;
  width: 100%;
  max-width: 320px;
  height: auto;
  margin: 0 auto 1.75rem;
}

.section-img {
  display: block;
  width: 100%;
  max-width: 220px;
  height: auto;
  margin: 0 auto 1rem;
}

/* ── Stickers (가족 모티프 SVG) ── */
.sticker {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
.sticker-sm { width: 16px; height: 16px; }
.sticker-md { width: 24px; height: 24px; }
.sticker-lg { width: 36px; height: 36px; }
.sticker-xl { width: 56px; height: 56px; }

.sticker-leaf   { color: var(--leaf); }
.sticker-rose   { color: var(--rose); }
.sticker-butter { color: #E8C04D; }
.sticker-sky    { color: var(--sky); }
.sticker-accent { color: var(--accent); }

.intro-mark {
  display: block;
  margin: 0 auto 1.25rem 0;
}

.slogan-mark {
  display: block;
  margin: 1.5rem auto 0.5rem;
}

.bridge-leaf-right { transform: scaleX(-1); }

.signature-box {
  background: var(--bg-card);
  border-left: 3px solid var(--leaf);
  border-radius: 14px;
  padding: 20px 22px;
  font-size: 14px;
  line-height: 1.85;
  color: var(--text-mid);
  word-break: keep-all;
  font-weight: 400;
  box-shadow: 0 2px 10px rgba(58, 40, 20, 0.04);
}

.power-box {
  background: var(--accent-bg);
  border-radius: 14px;
  padding: 20px 22px;
  font-size: 14px;
  line-height: 1.85;
  color: var(--accent-text);
  word-break: keep-all;
  box-shadow: 0 2px 10px rgba(194, 107, 69, 0.08);
}

.reveal {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .55s ease, transform .55s ease;
  margin-bottom: 2rem;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.bridge-wrap {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .65s ease .7s, transform .65s ease .7s;
}
.bridge-wrap.visible { opacity: 1; transform: translateY(0); }

.bridge-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1.75rem;
}
.bridge-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--leaf) 30%, var(--leaf) 70%, transparent);
  opacity: 0.5;
}
.bridge-label {
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: .1em;
  white-space: nowrap;
}

.result-bridge {
  font-size: 15px;
  color: var(--text);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 1rem;
}

.slogan-line {
  font-family: var(--serif);
  font-size: clamp(15px, 2.6vw, 17px);
  font-weight: 600;
  color: var(--accent-text);
  line-height: 1.6;
  margin-top: 1.25rem;
  letter-spacing: .01em;
  word-break: keep-all;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 2.5rem;
  flex-wrap: wrap;
  opacity: 0;
  transition: opacity .5s ease 1.5s;
}
.result-actions.visible { opacity: 1; }

.btn-ghost {
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border);
  padding: 11px 20px;
  font-family: var(--ui);
  font-size: 13px;
  cursor: pointer;
  border-radius: 12px;
  transition: border-color .2s, color .2s, background .2s, transform .15s;
}
.btn-ghost:hover {
  border-color: var(--text-mid);
  color: var(--text);
  background: var(--bg-card);
  transform: translateY(-1px);
}

.btn-accent {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 11px 20px;
  font-family: var(--ui);
  font-size: 13px;
  cursor: pointer;
  border-radius: 12px;
  transition: background .2s, transform .15s, box-shadow .2s;
}
.btn-accent:hover {
  background: var(--accent-bg);
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(194, 107, 69, 0.15);
}

.campaign-footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.8;
  opacity: 0;
  transition: opacity .5s ease 2s;
  word-break: keep-all;
}
.campaign-footer.visible { opacity: 1; }
.footer-eyebrow {
  margin-bottom: .5rem;
  color: var(--text-light);
}
.footer-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-mid);
  margin-bottom: 6px;
}

/* ── Desktop: side-by-side choices ── */
@media (min-width: 580px) {
  .choices { flex-direction: row; }
  .choice-card { flex: 1; }
  .choice-card:hover { transform: translateY(-2px); }
}

@media (max-width: 480px) {
  .screen { padding: 56px 20px 40px; }
  .q-header { margin-bottom: 2.5rem; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="sticker-house" viewBox="0 0 32 32">
      <path d="M16 3 L3 14 L3 27 a2 2 0 0 0 2 2 L27 29 a2 2 0 0 0 2 -2 L29 14 Z" fill="currentColor"/>

    </symbol>
    <symbol id="sticker-heart" viewBox="0 0 32 32">
      <path d="M16 27 C 14 23, 4 19, 4 11 C 4 7, 7 4, 11 4 C 13 4, 16 7, 16 9 C 16 7, 19 4, 21 4 C 25 4, 28 7, 28 11 C 28 19, 18 23, 16 27 Z" fill="currentColor"/>

  </defs>
</svg>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Intro -->
<div class="screen" id="screenIntro">
  <svg class="sticker sticker-xl sticker-leaf intro-mark" aria-hidden="true"><use href="#sticker-house"/></svg>
  <h1 class="intro-title">우리 가족은<br>어떤 가족일까요?</h1>
  <p class="intro-desc">
    8가지 질문에 솔직하게 답해주세요.<br>
    우리 가족만의 이야기를 들려드릴게요.<br>
    그리고, 한 가지를 더 알려드립니다.
  </p>
  <p class="intro-meta">약 2분 소요 &nbsp;·&nbsp; 정답 없음</p>
  <button class="btn-primary" onclick="startTest()">시작하기 &nbsp;→</button>
</div>

<!-- Question -->
<div class="screen hidden" id="screenQuestion">
  <div class="q-header">
    <span class="q-num" id="qNum">Q.1 / 6</span>
    <span class="q-axis" id="qAxis"></span>
  </div>
  <p class="q-text" id="qText"></p>
  <div class="choices" id="choices"></div>
</div>

<!-- Result -->
<div class="screen hidden" id="screenResult">
  <p class="eyebrow">나의 가족 유형</p>
  <img id="imgType" class="type-img" alt="" loading="lazy" onerror="this.style.display='none'">
  <p class="result-tag" id="rTag"></p>
  <h2 class="result-name" id="rName"></h2>
  <p class="result-tagline" id="rTagline"></p>
  <img id="imgTraits" class="section-img" alt="" loading="lazy" onerror="this.style.display='none'">
  <p class="result-traits" id="rTraits"></p>

  <div class="reveal" id="signatureWrap">
    <img id="imgSignature" class="section-img" alt="" loading="lazy" onerror="this.style.display='none'">
    <p class="section-label"><svg class="sticker sticker-sm sticker-leaf" aria-hidden="true"><use href="#sticker-leaf"/></svg>이게 바로 찐모습</p>
    <div class="signature-box" id="rSignature"></div>
  </div>

  <div class="reveal" id="powerWrap">
    <img id="imgPower" class="section-img" alt="" loading="lazy" onerror="this.style.display='none'">
    <p class="section-label"><svg class="sticker sticker-sm sticker-rose" aria-hidden="true"><use href="#sticker-heart"/></svg>함께여서 POWER UP</p>
    <div class="power-box" id="rPower"></div>
  </div>

  <div class="bridge-wrap" id="bridgeWrap">
    <div class="bridge-divider">
      <svg class="sticker sticker-sm sticker-leaf" aria-hidden="true"><use href="#sticker-leaf"/></svg>
      <div class="bridge-line"></div>
      <span class="bridge-label">사실은</span>
      <div class="bridge-line"></div>
      <svg class="sticker sticker-sm sticker-leaf bridge-leaf-right" aria-hidden="true"><use href="#sticker-leaf"/></svg>
    </div>
    <p class="result-bridge" id="rBridge"></p>
    <img id="imgSlogan" class="section-img" alt="" loading="lazy" onerror="this.style.display='none'">
    <svg class="sticker sticker-md sticker-butter slogan-mark" aria-hidden="true"><use href="#sticker-star"/></svg>
    <p class="slogan-line">입양, 한 아이의 온 세상을 만듭니다</p>
  </div>

  <div class="result-actions" id="rActions">
    <button class="btn-primary" onclick="shareResult()">결과 저장하기</button>
    <button class="btn-ghost" onclick="retryTest()">다시 하기</button>
    <button class="btn-accent" onclick="shareSNS()">SNS 공유하기</button>
    <button class="btn-accent" onclick="learnMore()">자세한 내용 확인하기 →</button>
  </div>

  <div class="campaign-footer" id="rFooter">
    <p class="eyebrow footer-eyebrow">입양의날 캠페인 &nbsp;·&nbsp; 5월 11일</p>
    <p class="footer-title">입양의날 인식개선 캠페인</p>
    지금 이 순간에도 가족을 기다리는 아이들이 있습니다.<br>
    한 아이의 온 세상이 되어줄 수 있는 가족을 기다리고 있어요.
  </div>
</div>

<script>
const Qs = [
  { text: "우리 가족은 주말이 되면?", a: "집에서 각자 혹은 같이 푹 쉬는 게 최고!", b: "무조건 밖으로! 새로운 곳을 찾아 떠나야지!", axis: "주말" },

  { text: "가족과 외식 메뉴를 정할 때 우리는?", a: "항상 먹던 단골집이나 익숙한 메뉴가 편해요.", b: "SNS 핫플레이스나 새로운 요리에 도전하는 걸 즐겨요.", axis: "외식" },
  { text: "집안 분위기를 결정하는 우리 가족의 필수 아이템은?", a: "마음이 편안해지는 책과 은은한 조명", b: "다 함께 즐길 수 있는 보드게임이나 최신형 TV", axis: "분위기" },
  { text: "가족 여행 계획을 세울 때 우리 가족은?", a: "시간 단위로 꼼꼼하게 일정을 짜는 계획파", b: "발길 닿는 대로 그날 기분에 따라 움직이는 자유파", axis: "여행" },
  { text: "우리 가족의 애정 표현 방식은?", a: "말하지 않아도 느껴지는 묵묵한 배려와 챙겨주기", b: "'사랑해', '고마워' 표현도 듬뿍 적극적인 표현!", axis: "애정" },

  { text: "우리 가족을 한 단어로 정의한다면?", a: "언제든 돌아와 쉴 수 있는 '포근한 보금자리'", b: "함께라면 무엇이든 즐거운 '최고의 팀'", axis: "정의" }
];

const Weights = [
  { A: { 1:1, 5:1, 7:1, 9:1, 10:1 },  B: { 2:2, 3:1, 6:1, 8:1, 9:1 }      },
  { A: { 1:1, 4:1, 7:1, 10:1 },       B: { 2:1, 3:1, 6:2, 8:1 }           },
  { A: { 1:1, 3:1, 7:1, 10:1 },       B: { 2:1, 3:2, 4:1, 5:1, 6:1, 8:1 } },
  { A: { 1:2, 4:1, 5:1, 8:1 },        B: { 2:1, 3:1, 6:1, 8:2, 9:1 }      },
  { A: { 4:2, 8:1, 10:1 },            B: { 2:1, 5:1, 6:1, 9:2 }           },

  { A: { 1:1, 5:1, 7:1, 10:1 },       B: { 3:1, 4:1, 6:1, 8:1 }           },
  { A: { 1:1, 7:1, 9:1, 10:2 },       B: { 2:1, 3:1, 4:1, 8:1 }           }
];

const Results = [

let curQ = 0, answers = [], currentResult = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
    s.classList.remove('visible');
  });
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function setImg(id, src, alt) {
  const el = document.getElementById(id);
  el.style.display = '';
  el.alt = alt;
  el.src = src;
}

function startTest() {
  curQ = 0; answers = [];
  setProgress(0);
  renderQuestion();
  show('screenQuestion');
}

function renderQuestion() {
  const q = Qs[curQ];
  document.getElementById('qNum').textContent = `Q.${curQ + 1} / ${Qs.length}`;
  document.getElementById('qAxis').textContent = q.axis;
  document.getElementById('qText').textContent = q.text;
  setProgress((curQ / Qs.length) * 100);

  const container = document.getElementById('choices');
  container.innerHTML = '';
  [{ t: q.a, v: 'A' }, { t: q.b, v: 'B' }].forEach(opt => {
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.innerHTML = `<div class="choice-body">${opt.t}</div>`;
    card.addEventListener('click', () => pick(opt.v, card));
    container.appendChild(card);
  });
}

function pick(val, el) {
  document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  answers.push(val);

  setTimeout(() => {
    curQ++;
    if (curQ < Qs.length) {
      const scr = document.getElementById('screenQuestion');
      scr.style.opacity = '0';
      scr.style.transform = 'translateY(-14px)';
      setTimeout(() => {
        renderQuestion();
        scr.style.transition = 'none';
        scr.style.opacity = '0';
        scr.style.transform = 'translateY(20px)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          scr.style.transition = '';
          scr.style.opacity = '1';
          scr.style.transform = 'translateY(0)';
        }));
      }, 300);
    } else {
      showResult();
    }
  }, 380);
}

function showResult() {
  setProgress(100);

  const scores = new Array(Results.length).fill(0);
  answers.forEach((ans, i) => {
    Object.entries(Weights[i][ans]).forEach(([t, pts]) => { scores[+t - 1] += pts; });
  });

  let bestIdx = 0;
  for (let i = 1; i < scores.length; i++) {
    if (scores[i] > scores[bestIdx]) bestIdx = i;
  }
  const r = Results[bestIdx];
  currentResult = r;

  const pad2 = n => String(n).padStart(2, '0');
  document.getElementById('rTag').textContent = `유형 ${pad2(bestIdx + 1)} / ${pad2(Results.length)}`;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rTagline').textContent = r.tagline;
  document.getElementById('rTraits').textContent = r.traits;
  document.getElementById('rSignature').textContent = r.signature;
  document.getElementById('rPower').textContent = r.power;
  document.getElementById('rBridge').innerHTML = r.bridge
    .split('\n')
    .map(line => line.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch])))
    .join('<br>');

  const sectionBase = `images/sections/${r.slug}`;
  setImg('imgType',      `images/types/${r.slug}.png`, `${r.name} 일러스트`);
  setImg('imgTraits',    `${sectionBase}/traits.png`,    '');
  setImg('imgSignature', `${sectionBase}/signature.png`, '');
  setImg('imgPower',     `${sectionBase}/power.png`,     '');
  setImg('imgSlogan',    `${sectionBase}/slogan.png`,    '');

  ['signatureWrap', 'powerWrap', 'bridgeWrap', 'rActions', 'rFooter'].forEach(id =>
    document.getElementById(id).classList.remove('visible')
  );
  show('screenResult');

  setTimeout(() => document.getElementById('signatureWrap').classList.add('visible'), 350);
  setTimeout(() => document.getElementById('powerWrap').classList.add('visible'), 650);
  setTimeout(() => document.getElementById('bridgeWrap').classList.add('visible'), 1000);
  setTimeout(() => {
    document.getElementById('rActions').classList.add('visible');
    document.getElementById('rFooter').classList.add('visible');
  }, 1750);
}

function retryTest() {
  const scr = document.getElementById('screenResult');
  scr.style.opacity = '0'; scr.style.transform = 'translateY(-14px)';
  setTimeout(startTest, 300);
}

function buildShareText() {
  if (!currentResult) return '';
  return `"${currentResult.signature}"

— ${currentResult.name} —

당신의 가족은 어떤 모습일까요?

${location.href}
#입양의날 #5월11일`;
}

async function loadResultImageFile() {
  if (!currentResult) return null;
  try {
    const res = await fetch(`images/types/${currentResult.slug}.png`, { cache: 'no-store' });
    if (!res.ok) return null;
    const blob = await res.blob();
    return new File([blob], `우리가족-${currentResult.name}.png`, { type: blob.type || 'image/png' });
  } catch (e) {
    return null;
  }
}

function downloadFile(file) {
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function shareResult() {
  const file = await loadResultImageFile();
  if (!file) {
    alert('결과 이미지가 아직 준비되지 않았어요. 잠시 후 다시 시도해 주세요.');
    return;
  }
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: currentResult.name });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  downloadFile(file);
}

async function shareSNS() {
  const file = await loadResultImageFile();
  const text = buildShareText();
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], text, title: currentResult.name });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  if (navigator.share) {
    try {
      await navigator.share({ title: currentResult.name, text, url: location.href });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(text);
      alert('공유 API가 지원되지 않는 환경이에요.\n결과 텍스트를 복사했으니 원하는 곳에 붙여넣어 주세요.');
      return;
    } catch (e) {}
  }
  alert(text);
}

function learnMore() {
  alert('입양 정보 페이지로 이동합니다.\n(랜딩페이지 URL 연결 예정)');
}

show('screenIntro');
