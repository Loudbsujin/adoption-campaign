<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 사람일까 — 입양의날</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #F8F3EB;
  --bg-card:      #FEFCF8;
  --text:         #1E1610;
  --text-mid:     #6B5B4A;
  --text-light:   #A8927E;
  --accent:       #B85C38;
  --accent-bg:    #F5E8DF;
  --accent-text:  #8A3D21;
  --border:       #E2D8CE;
  --border-hover: #C4B5A5;
  --progress:     #8C9E8A;
  --serif: 'Noto Serif KR', Georgia, serif;
  --sans:  'Noto Sans KR', system-ui, sans-serif;
}

html { background: var(--bg); }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Progress ── */
.progress-track {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--border);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: var(--progress);
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
}

/* ── Screens ── */
.screen {
  width: 100%;
  max-width: 540px;
  padding: clamp(60px, 10vh, 100px) 28px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.screen.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.screen.hidden { display: none; }

/* ── Intro ── */
.eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: 2.5rem;
}

.intro-title {
  font-family: var(--serif);
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 600;
  line-height: 1.25;
  color: var(--text);
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.intro-desc {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.9;
  margin-bottom: 2rem;
  word-break: keep-all;
  max-width: 400px;
  font-weight: 300;
}

.intro-meta {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 3rem;
  letter-spacing: .04em;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 15px 32px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .2s, transform .15s;
  border-radius: 2px;
}
.btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

/* ── Question ── */
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3.5rem;
}

.q-num {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: .06em;
}

.q-axis {
  font-size: 11px;
  color: var(--text-light);
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
}

.q-text {
  font-family: var(--serif);
  font-size: clamp(17px, 3.5vw, 22px);
  font-weight: 400;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  word-break: keep-all;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.choice-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .1s;
  word-break: keep-all;
}
.choice-card:hover {
  border-color: var(--border-hover);
  background: #FEFAF5;
  transform: translateX(3px);
}
.choice-card.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  transform: translateX(0);
}
.choice-glyph {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-light);
  letter-spacing: .08em;
  margin-bottom: 7px;
}
.choice-card.selected .choice-glyph { color: var(--accent); }
.choice-body {
  font-size: 14px;
  color: var(--text-mid);
  line-height: 1.75;
}
.choice-card.selected .choice-body { color: var(--accent-text); }

/* ── Result ── */
.result-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: .75rem;
  text-transform: uppercase;
}

.result-name {
  font-family: var(--serif);
  font-size: clamp(24px, 5.5vw, 36px);
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 1.75rem;
  word-break: keep-all;
}

.result-me {
  font-size: 15px;
  color: var(--text-mid);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 2.5rem;
}

.bridge-wrap {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .65s ease .7s, transform .65s ease .7s;
}
.bridge-wrap.visible { opacity: 1; transform: translateY(0); }

.bridge-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1.75rem;
}
.bridge-line { flex: 1; height: 1px; background: var(--border); }
.bridge-label {
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: .1em;
  white-space: nowrap;
}

.result-bridge {
  font-size: 15px;
  color: var(--text);
  line-height: 1.95;
  word-break: keep-all;
  font-weight: 300;
  margin-bottom: 1rem;
}

.child-tag {
  display: inline-block;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--accent);
  color: var(--accent);
  letter-spacing: .04em;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 2.5rem;
  flex-wrap: wrap;
  opacity: 0;
  transition: opacity .5s ease 1.5s;
}
.result-actions.visible { opacity: 1; }

.btn-ghost {
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border);
  padding: 12px 22px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
  transition: border-color .2s, color .2s;
}
.btn-ghost:hover { border-color: var(--text-mid); color: var(--text); }

.btn-accent {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 12px 22px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
  transition: background .2s;
}
.btn-accent:hover { background: var(--accent-bg); }

.campaign-footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.8;
  opacity: 0;
  transition: opacity .5s ease 2s;
  word-break: keep-all;
}
.campaign-footer.visible { opacity: 1; }
.footer-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-mid);
  margin-bottom: 6px;
}

/* ── Desktop: side-by-side choices ── */
@media (min-width: 580px) {
  .choices { flex-direction: row; }
  .choice-card { flex: 1; }
  .choice-card:hover { transform: translateY(-2px); }
}

@media (max-width: 480px) {
  .screen { padding: 56px 20px 40px; }
  .q-header { margin-bottom: 2.5rem; }
}
</style>
</head>
<body>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Intro -->
<div class="screen" id="screenIntro">
  <p class="eyebrow">입양의날 캠페인 &nbsp;·&nbsp; 5월 11일</p>
  <h1 class="intro-title">나는 어떤<br>사람일까요?</h1>
  <p class="intro-desc">
    6가지 질문에 솔직하게 답해주세요.<br>
    당신에 대한 이야기를 들려드릴게요.<br>
    그리고, 한 가지를 더 알려드립니다.
  </p>
  <p class="intro-meta">약 2분 소요 &nbsp;·&nbsp; 정답 없음</p>
  <button class="btn-primary" onclick="startTest()">시작하기 &nbsp;→</button>
</div>

<!-- Question -->
<div class="screen hidden" id="screenQuestion">
  <div class="q-header">
    <span class="q-num" id="qNum">Q.1 / 6</span>
    <span class="q-axis" id="qAxis"></span>
  </div>
  <p class="q-text" id="qText"></p>
  <div class="choices" id="choices"></div>
</div>

<!-- Result -->
<div class="screen hidden" id="screenResult">
  <p class="eyebrow">나의 유형</p>
  <p class="result-tag" id="rLabel"></p>
  <h2 class="result-name" id="rName"></h2>
  <p class="result-me" id="rMe"></p>

  <div class="bridge-wrap" id="bridgeWrap">
    <div class="bridge-divider">
      <div class="bridge-line"></div>
      <span class="bridge-label">사실은</span>
      <div class="bridge-line"></div>
    </div>
    <p class="result-bridge" id="rBridge"></p>
    <span class="child-tag" id="rChildTag"></span>
  </div>

  <div class="result-actions" id="rActions">
    <button class="btn-primary" onclick="shareResult()">결과 공유하기</button>
    <button class="btn-ghost" onclick="retryTest()">다시 하기</button>
    <button class="btn-accent" onclick="learnMore()">더 알아보기 →</button>
  </div>

  <div class="campaign-footer" id="rFooter">
    <p class="footer-title">입양의날 인식개선 캠페인</p>
    지금 이 순간에도 가족을 기다리는 아이들이 있습니다.<br>
    남아, 장애아동, 조금 더 자란 아이들 — 모두 누군가의 전부가 될 수 있어요.
  </div>
</div>

<script>
const Qs = [
  { text: "나는 사람들과 가까워지는 데 시간이 걸리지만, 한번 마음을 열면 깊이 연결되는 편이다", a: "맞다. 천천히 열리지만, 한번 연결되면 쉽게 흔들리지 않는다", b: "아니다. 처음부터 잘 어울리고 빠르게 친해지는 편이다", axis: "관계 형성" },
  { text: "계획이 틀어져도 크게 당황하지 않는다. 흘러가는 대로 적응하는 편이다", a: "맞다. 변수가 와도 유연하게 받아들이는 편이다", b: "아니다. 준비가 잘 됐을 때 더 안정감을 느낀다", axis: "불확실성" },
  { text: "누군가 힘들어 보일 때, 말보다 조용히 곁에 있어주는 쪽을 택한다", a: "맞다. 존재 자체가 위로라고 생각한다", b: "아니다. 어떤 말을 건넬지 생각하고 직접 표현하는 편이다", axis: "돌봄 방식" },
  { text: "완성된 것보다 아직 가능성이 열려 있는 것에 더 끌린다", a: "맞다. 가능성을 품은 것이 더 흥미롭다", b: "아니다. 검증되고 안정적인 것에 더 믿음이 간다", axis: "가능성 vs 안정" },
  { text: "오래 걸려도 내가 직접 만들어가는 과정 자체가 의미 있다", a: "맞다. 과정이 곧 경험이라 생각한다", b: "아니다. 효율적으로 결과에 도달하는 것이 더 중요하다", axis: "과정 vs 결과" },
  { text: "나와 다른 점이 많은 사람에게 오히려 더 호기심이 생긴다", a: "맞다. 다름이 배움이 된다고 느낀다", b: "아니다. 나와 비슷한 사람과 있을 때 더 편안하다", axis: "다름에 대한 반응" }
];

const Results = [
  {
    label: "유형 D",
    name: "다름이 오히려 선물인 사람",
    me: "당신은 나와 다른 사람에게서 배울 것을 찾습니다. 차이를 두려움이 아닌 풍요로움으로 보는 시선이 있어요. 예측 가능한 것보다 새로운 가능성 쪽으로 발을 내딛는 사람입니다.",
    bridge: "다른 환경에서 자란 아이는 다른 시선을 가지고 있습니다. 그 다름이 가족 모두를 더 넓고 깊게 만들어주기도 해요. 지금 이 사실을 처음 알게 된 분들이 많습니다.",
    childTag: "기다리는 아이들의 이야기"
  },
  {
    label: "유형 C",
    name: "말 없이도 전해지는 사람",
    me: "당신은 곁에 있는 것만으로도 충분한 사람입니다. 많은 말이 필요 없어요. 조용히 함께하는 것만으로 위로가 된다는 걸 몸으로 아는 사람.",
    bridge: "남자아이들은 말이 적을 수 있습니다. 하지만 함께하는 것만으로 느끼는 것들이 있어요. 그 침묵을 이해하는 어른이 곁에 있다면, 아이의 세계는 달라집니다.",
    childTag: "입양을 기다리는 남자아이들"
  },
  {
    label: "유형 B",
    name: "예상 못한 것에서 빛나는 사람",
    me: "당신은 계획 밖의 상황에서도 흔들리지 않습니다. 변수를 두려워하지 않고, 오히려 그 안에서 새로운 가능성을 발견하는 사람이에요.",
    bridge: "장애가 있는 아이들도 예상과 다를 뿐, 그 자체로 완전합니다. 다름을 가능성으로 읽을 수 있는 시선이 있는 사람이 가장 필요한 아이들이에요.",
    childTag: "장애아동 입양을 기다리는 아이들"
  },
  {
    label: "유형 A",
    name: "천천히, 그러나 단단하게",
    me: "당신은 관계를 급하게 맺지 않습니다. 시간이 걸리지만, 한번 마음을 열면 쉽게 흔들리지 않아요. 표면보다 깊이를 택하는 사람.",
    bridge: "조금 더 자란 아이들도 그렇습니다. 낯선 환경에 적응하는 데 시간이 필요할 뿐이에요. 기다림을 아는 어른 곁에서 가장 잘 피어납니다. 지금 청소년 입양을 기다리는 아이들이 있습니다.",
    childTag: "연장아·청소년 입양을 기다리는 아이들"
  }
];

let curQ = 0, answers = [];

function show(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
    s.classList.remove('visible');
  });
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function startTest() {
  curQ = 0; answers = [];
  setProgress(0);
  renderQuestion();
  show('screenQuestion');
}

function renderQuestion() {
  const q = Qs[curQ];
  document.getElementById('qNum').textContent = `Q.${curQ + 1} / ${Qs.length}`;
  document.getElementById('qAxis').textContent = q.axis;
  document.getElementById('qText').textContent = q.text;
  setProgress((curQ / Qs.length) * 100);

  const container = document.getElementById('choices');
  container.innerHTML = '';
  [{ g: 'ㄱ', t: q.a, v: 'A' }, { g: 'ㄴ', t: q.b, v: 'B' }].forEach(opt => {
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.innerHTML = `<div class="choice-glyph">${opt.g}</div><div class="choice-body">${opt.t}</div>`;
    card.addEventListener('click', () => pick(opt.v, card));
    container.appendChild(card);
  });
}

function pick(val, el) {
  document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  answers.push(val);

  setTimeout(() => {
    curQ++;
    if (curQ < Qs.length) {
      const scr = document.getElementById('screenQuestion');
      scr.style.opacity = '0';
      scr.style.transform = 'translateY(-14px)';
      setTimeout(() => {
        renderQuestion();
        scr.style.transition = 'none';
        scr.style.opacity = '0';
        scr.style.transform = 'translateY(20px)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          scr.style.transition = '';
          scr.style.opacity = '1';
          scr.style.transform = 'translateY(0)';
        }));
      }, 300);
    } else {
      showResult();
    }
  }, 380);
}

function showResult() {
  setProgress(100);
  const score = answers.filter(a => a === 'A').length;
  const r = score <= 1 ? Results[0] : score <= 3 ? Results[1] : score <= 4 ? Results[2] : Results[3];

  document.getElementById('rLabel').textContent = r.label;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rMe').textContent = r.me;
  document.getElementById('rBridge').textContent = r.bridge;
  document.getElementById('rChildTag').textContent = r.childTag;

  ['bridgeWrap', 'rActions', 'rFooter'].forEach(id => document.getElementById(id).classList.remove('visible'));
  show('screenResult');

  setTimeout(() => document.getElementById('bridgeWrap').classList.add('visible'), 500);
  setTimeout(() => {
    document.getElementById('rActions').classList.add('visible');
    document.getElementById('rFooter').classList.add('visible');
  }, 1300);
}

function retryTest() {
  const scr = document.getElementById('screenResult');
  scr.style.opacity = '0'; scr.style.transform = 'translateY(-14px)';
  setTimeout(startTest, 300);
}

function shareResult() {
  const name = document.getElementById('rName').textContent;
  const label = document.getElementById('rLabel').textContent;
  const text = `${label} "${name}"\n입양의날 캠페인에서 나에 대해 알게 됐어요.`;
  if (navigator.share) {
    navigator.share({ title: '나는 어떤 사람일까', text, url: location.href });
  } else {
    navigator.clipboard.writeText(text).then(() => alert('결과가 복사되었습니다.'));
  }
}

function learnMore() {
  alert('캠페인 공식 페이지로 이동합니다.\n(랜딩페이지 URL 연결 예정)');
}

show('screenIntro');
</script>
</body>
</html>
